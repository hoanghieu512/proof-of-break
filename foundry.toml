[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Arc targets the Osaka hardfork. Cancun is a conservative subset that Arc
# fully supports, and it gives us transient storage (TSTORE) for the
# reentrancy guard in BountyRegistry later.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[invariant]
runs = 128
depth = 100
# Attempts revert constantly by design — a bounty already paid, a target that
# refuses the input, an invariant already broken. Those are outcomes to explore,
# not failures, so a revert must not end the run.
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# Arcscan is Blockscout v11.2.3; Blockscout verification takes any non-empty key.
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api/", chain = 5042002 }
